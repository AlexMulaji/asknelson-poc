services:
  asknelson:
    build: .
    ports:
      - "8180:8080"
    environment:
      # Change this before deploying anywhere — it protects /admin.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:kaelo}
    volumes:
      # Admin content edits survive rebuilds and restarts.
      - asknelson-data:/app/data
    restart: unless-stopped

volumes:
  asknelson-data:
