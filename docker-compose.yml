services:
  asknelson:
    build: .
    ports:
      - "8180:8080"
    environment:
      # The first admin account, created on first boot only if no admin exists
      # yet. It gets the owner role, and its first sign-in must enrol
      # two-factor authentication before it can do anything. Every admin after
      # that is created from inside the portal, so these are dead weight after
      # the first run — deliberately not required, or every later `compose up`
      # would demand them. When they are missing and no admin exists, the app
      # still starts and warns at boot naming exactly what to set.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # How long a signed-in admin stays signed in, and how long the gap
      # between password and second factor may be.
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      ADMIN_MFA_WINDOW_MINUTES: ${ADMIN_MFA_WINDOW_MINUTES:-10}
      # Demo mode: shows the current authenticator code on the sign-in screen,
      # which means the portal has no working second factor. Off by default;
      # the app prints a banner at every boot while it is on.
      ADMIN_MFA_ECHO: ${ADMIN_MFA_ECHO:-false}
      # Upload ceilings. The admin editor downscales and re-encodes in the
      # browser first; these are the backstop, and what members' load times
      # actually depend on.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2}
      MAX_IMAGE_DIMENSION: ${MAX_IMAGE_DIMENSION:-2400}
      # Event tracking. Remove this line to run without analytics: the app works
      # exactly as before and the tracking endpoints become no-ops.
      # Points at the shared Postgres container (the Odoo one), where the
      # app's tables live in their own `asknelson` schema. Unset it and the
      # app falls back to the local `db` service below, which is the rollback
      # path: `docker compose --profile legacy-db up -d db`.
      DATABASE_URL: ${ASKNELSON_DATABASE_URL:-postgres://asknelson:${POSTGRES_PASSWORD:-asknelson}@db:5432/asknelson}
      # Plaintext is acceptable only because app and db share compose's private
      # network. Against a hosted database use verify-full (see .env.example).
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      # Seals personal information at rest (AES-256-GCM, see server/crypto.js).
      # REQUIRED: run `npm run keys:generate` and put the line in .env (which is
      # gitignored). Keep a copy in a secrets manager — lose it and every
      # encrypted column is unreadable.
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?Set DATA_ENCRYPTION_KEYS in .env - run npm run keys:generate}
      # POPIA s14 retention, in days (0 keeps forever).
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-730}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-1825}
      # Set true once TLS is terminated in front of the app: redirects plain
      # HTTP to HTTPS (HSTS is sent on HTTPS responses regardless).
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      # Used to build the WhatsApp link shown in /admin. Set this to the public
      # URL members will actually open.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8180}
      # Keys the one-way hashes of email / phone / ID number. Change it before
      # first run and then never again — rotating it invalidates every
      # anonymous account's login.
      AUTH_PEPPER: ${AUTH_PEPPER:-change-me-before-first-run}
      # OTP delivery. 'console' logs the PIN in the container logs; set
      # OTP_TRANSPORT=twilio|sendgrid|webhook plus that provider's credentials
      # to send for real. See the README.
      OTP_TRANSPORT: ${OTP_TRANSPORT:-console}
      #
      # ⚠  DEMO MODE — defaults ON so sign-up can be tested without an SMS or
      #    email provider. The PIN is shown on the verification screen, which
      #    means ANYONE CAN VERIFY AN ADDRESS THEY DO NOT OWN.
      #
      #    Set OTP_ECHO=false before this is reachable by real users.
      #
      OTP_ECHO: ${OTP_ECHO:-true}
    volumes:
      # Admin content edits survive rebuilds and restarts.
      - asknelson-data:/app/data
    # The shared database is owned by another compose project, so it cannot
    # be waited on here. The app retries its first connection at boot.
    networks:
      - default
      - shared-db
    restart: unless-stopped

  # The original, app-private database. Its data was merged into the shared
  # container, so it no longer starts by default and is kept only as a
  # rollback: `docker compose --profile legacy-db up -d db`.
  db:
    profiles: ["legacy-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asknelson
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asknelson}
      POSTGRES_DB: asknelson
    ports:
      # Bound to loopback only, so a GUI client on this machine can connect but
      # the database is never reachable from the network. 5433 on the host keeps
      # out of the way of a local Postgres already using 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - asknelson-db:/var/lib/postgresql/data
    # The app runs migrations at boot and exits if they fail, so it must not
    # start until Postgres is actually accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asknelson -d asknelson"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional: exposes the shared database on 127.0.0.1:5433 for psql, a GUI
  # client or a local `npm start`, which cannot reach a container network.
  # Start it with `docker compose --profile tools up -d dbproxy`.
  dbproxy:
    profiles: ["tools"]
    image: alpine/socat:1.8.0.0
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:kaelo19test-db-1:5432
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - shared-db
    restart: unless-stopped

networks:
  default:
  # Created by the Odoo compose project (kaelo19test); joined, never managed.
  shared-db:
    name: kaelo19test_default
    external: true

volumes:
  asknelson-data:
  asknelson-db:
