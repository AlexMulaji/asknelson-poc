<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#01243B" />
    <!-- Sets the theme before the first paint. Inline and synchronous on
         purpose: as a module it would run after the browser has already
         painted the light canvas, which is a white flash on every cold start
         for anyone using dark mode. Mirrors src/lib/theme.js -- keep the
         storage key and the meta colours in step with it. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('asknelson:theme')
          var pref = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0D1D28')
          }
        } catch (e) {
          /* Storage blocked, or no matchMedia: light is the safe default. */
        }
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AskNelson" />
    <meta
      name="description"
      content="Real support from real people. Content and wellness for your everyday."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Nunito stands in for the brand typeface: the mockup PDFs ship their
         text as outlines, so the original family name isn't recoverable from
         them. Swap this and the Tailwind fontFamily if the licensed font
         is available. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>AskNelson</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
